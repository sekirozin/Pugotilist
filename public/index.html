<style>
/* Pugotilab account pattern — Pugotiread reference, PQA-101 */
.pa-shell{position:relative;flex:none;font-family:inherit;height:42px;align-self:center}
.pa-shell .pa-trigger{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;width:auto;height:42px;min-height:42px;margin:0;padding:4px 8px 4px 4px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--pa-text);cursor:pointer;font:inherit;box-sizing:border-box;list-style:none}
.pa-trigger::-webkit-details-marker{display:none}
.pa-shell .pa-trigger:hover,.pa-shell .pa-item:hover{background:var(--pa-hover)}
.pa-shell .pa-trigger:focus-visible,.pa-shell .pa-item:focus-visible{outline:2px solid var(--pa-accent);outline-offset:2px}
.pa-shell .pa-avatar{display:grid;place-items:center;width:32px;height:32px;min-width:32px;flex:0 0 32px;margin:0;border:1px solid var(--pa-border);border-radius:50%;overflow:hidden;background-image:none;background-color:var(--pa-accent);background-position:center;background-size:cover;color:#fff;font-size:12px;font-weight:800;box-sizing:border-box}
.pa-shell .pa-avatar img{display:block;width:100%;height:100%;object-fit:cover}
.pa-shell .pa-caret{display:block;width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;color:var(--pa-muted)}
.pa-shell .pa-menu{position:absolute;top:calc(100% + 7px);right:0;left:auto;z-index:1000;animation:none;transform:none;width:244px;max-width:calc(100vw - 24px);margin:0;padding:0;overflow:hidden;border:1px solid var(--pa-border);border-radius:13px;background:var(--pa-bg);color:var(--pa-text);box-shadow:0 24px 64px #0006;box-sizing:border-box;text-align:left}
.pa-shell .profile-menu-actions{padding:0}
.pa-menu[hidden]{display:none!important}
.pa-shell .pa-summary{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;padding:14px;border:0;border-bottom:1px solid var(--pa-border);margin:0}
.pa-shell .pa-summary .pa-avatar{width:34px;height:34px;min-width:34px}
.pa-shell .pa-summary strong{display:block;font-size:14px;line-height:20px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:var(--pa-text)}
.pa-shell .pa-summary p,.pa-shell .pa-summary small,.pa-shell .pa-summary div>span{display:block;margin:2px 0 0;font-size:12px;line-height:17px;color:var(--pa-muted)}
.pa-shell .pa-item{display:flex;align-items:center;justify-content:flex-start;gap:9px;width:100%;min-height:42px;margin:0;padding:10px 14px;box-sizing:border-box;border:0;border-radius:0;background:transparent;color:var(--pa-text);text-align:left;text-decoration:none;font:inherit;font-size:14px;line-height:20px;font-weight:400;cursor:pointer}
.pa-shell .pa-item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.pa-shell .pa-item.pa-danger{color:var(--pa-danger,#ffb4ae)}

.pa-shell{--pa-accent:var(--brand,#3478f6);--pa-border:var(--line,#31485d);--pa-bg:var(--panel,#101721);--pa-hover:var(--panel-soft,#182534);--pa-text:var(--text,#e8edf3);--pa-muted:var(--muted,#91a0af)}
</style></head>
<body>
  <div id="app" class="center"><div class="loader" aria-label="Carregando"></div></div>
  <script src="/pugoti-conta.js?v=temas-modo-20261105c"></script>
  <script>
    // Tema da conta Pugotilab (menu da conta / Pugoti Profile) no tema claro/escuro do Pugotilist.
    window.pugotiAplicarTema = (tema) => { document.documentElement.dataset.theme = tema === "claro" ? "light" : "dark"; };
    window.pugotiAplicarTema(document.documentElement.dataset.pugotiTema || "escuro");
  </script>
  <script src="/ambient-effects.js?v=temas-modo-20261105c" defer></script>
  <script src="/mobile-drawer.js?v=mobile-drawer-20260818-1"></script>
  <script type="module" src="app.js?v=abas-20261109"></script>
</body>
