server {
  listen 80;
  server_name pugotilab.com;

  location /auth/ {
    proxy_pass http://pugotilab-auth:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /auth {
    proxy_pass http://pugotilab-auth:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /money {
    return 302 /money/;
  }

  location /money/ {
    proxy_pass http://pugotimoney:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://pugotimoney:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /read {
    return 302 /read/;
  }

  location = /list {
    return 302 /list/;
  }

  location /list/ {
    proxy_pass http://pugotilist:3020/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /read/ {
    proxy_pass http://pugotiread:8099/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~* ^/downloads/.+\.apk$ {
    root /usr/share/nginx/html;
    types { application/vnd.android.package-archive apk; }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name list.pugotilab.com;

  location / {
    proxy_pass http://pugotilist:3020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
